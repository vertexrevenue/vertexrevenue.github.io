name: Build website
# Builds website/ and publishes the result to the repo root on main,
# which GitHub Pages already serves. No Pages settings change needed.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-website
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: website
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish build to repo root
        run: |
          rm -rf assets
          cp -r website/dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets favicon.svg .nojekyll
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Publish website build"
          git push
